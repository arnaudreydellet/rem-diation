:root{--ink:#172c48;--muted:#5d718a;--line:#d9e4f1;--bg:#f7f9fd;--soft:#edf5ff;--shadow:0 5px 16px rgba(15,46,87,.045)}

/* ======================================================================
   Stud'Éval — interface de démonstration, identité harmonisée (31/10/2026)
   Repères tirés des captures de l'application : bleu #2d61f4, bleu pâle,
   cartes blanches, bordures fines, panneaux sans décoration de fond.
   Aucune dépendance réseau et aucune ressource graphique privée intégrée.
   ====================================================================== */
:root {
 --blue:#2e61f4; --blue-dark:#204ddb; --ink:#16264b;
 --muted:#64789b; --line:#d4dfff; --bg:#f5f7ff; --soft:#edf2ff;
 --red:#db4662; --orange:#e47c1d; --green:#009e79; --sky:#5255d4;
 --good:#008e72; --bad:#bc405d; --shadow:0 4px 16px rgba(43,76,156,.035);
 --st-accent:#2e61f4; --st-text:#14264a; --st-bg:#f5f7ff;
 --st-border:#d4dfff; --st-soft:#edf2ff;
}
html,body{min-height:100%;}
body{background:var(--st-bg);color:var(--st-text);font-family:Inter,"Segoe UI",Arial,system-ui,sans-serif; font-size:14.5px;line-height:1.5;letter-spacing:0}
body.st-app-shell{padding-left:248px}
.st-side{position:fixed;z-index:20;inset:0 auto 0 0;width:248px;background:#fff;border-right:1px solid #e0e7f9;border-top:4px solid var(--st-accent);padding:20px 10px 16px;display:flex;flex-direction:column;overflow-y:auto}
.st-logo{font-weight:830;font-size:29px;letter-spacing:-.065em;color:var(--st-accent);line-height:1.2;padding:4px 10px 8px;display:flex;align-items:center;gap:6px}
.st-logo-bars{display:inline-flex;align-items:end;gap:2px;height:20px;margin-top:3px}
.st-logo-bars i{display:block;width:3px;background:var(--st-accent);border-radius:3px}
.st-logo-bars i:nth-child(1){height:9px;opacity:.45}.st-logo-bars i:nth-child(2){height:15px;opacity:.65}.st-logo-bars i:nth-child(3){height:20px}
.st-school{padding:0 11px 28px;color:#7988a7;font-size:12px;line-height:1.6}
.st-menu{display:grid;gap:6px}
.st-menu button{background:transparent;color:#203257;border:0;min-height:44px;width:100%;text-align:left;padding:10px 11px;display:flex;align-items:center;gap:11px;border-radius:10px;font-size:14px;font-weight:660}

.st-side-bottom{margin-top:auto;border-top:1px solid #e2e8fc;padding:16px 8px 0;color:#6b7a9d;font-size:12px}
.st-profile{display:flex;align-items:center;gap:9px;border:1px solid #d4dfff;border-radius:12px;background:#f7f9ff;padding:10px;margin-top:10px;color:#23365c}
.st-avatar{width:31px;height:31px;background:#e3ebff;color:var(--st-accent);font-weight:780;border-radius:9px;display:grid;place-items:center}
.top{background:transparent;border:0}
.topin{max-width:1240px;padding:18px 24px 4px;min-height:67px;gap:10px}
.brand{font-size:17px;letter-spacing:0;color:var(--st-text);font-weight:760}

.card-title,.ed-subheading{color:var(--st-text)}
.field,input[type=number],select{border-color:#c9d8f8}

.notice{background:#fff7ed;border-color:#f3dbc6;color:#845824}
.success{background:#effaf7;border-color:#c8eadd;color:#13795f}
.danger{background:#fff3f5;border-color:#f2ccd4;color:#a83050}
.screen-footer{font-size:11px;color:#95a2b8;margin-top:23px}
/* Levels matching Stud'Éval results screenshots */
.ed-student-level{border-radius:6px}

.device-grid.st-two-options{grid-template-columns:repeat(2,minmax(0,1fr));max-width:980px;margin-left:auto;margin-right:auto;gap:16px}

.st-role-symbol{display:grid;place-items:center;background:#eaf0ff;color:#2e61f4;border-radius:50%;height:22px;width:22px;line-height:1;font-size:14px;font-weight:800}

body.st-role-prof .st-school #st-side-role{color:#1545c6}
body.st-role-prof .st-side{border-top-color:#2e61f4}
.st-role-transition{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:rgba(245,248,255,.90);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .74s cubic-bezier(.22,1,.36,1),visibility 0s linear .74s}
.st-role-transition.is-visible{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .62s cubic-bezier(.22,1,.36,1),visibility 0s}
.st-role-transition-card{width:min(100%,490px);display:flex;flex-direction:column;gap:15px;background:#fff;border:1px solid #cddcff;border-radius:19px;padding:31px 29px;box-shadow:0 18px 50px rgba(31,67,141,.12);text-align:center;transform:translateY(12px) scale(.985);transition:transform .68s cubic-bezier(.22,1,.36,1)}
.st-role-transition.is-visible .st-role-transition-card{transform:translateY(0) scale(1)}
.st-role-transition-eyebrow{font-size:12px;text-transform:uppercase;font-weight:800;color:#3564d8;letter-spacing:.065em}
.st-role-transition-flow{display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:780;color:#17305b;flex-wrap:wrap;line-height:1.4}

.st-role-transition-flow .st-role-to{color:#2059df}
.st-role-transition-arrow{display:grid;place-items:center;width:34px;height:34px;flex:none;background:#edf3ff;border-radius:50%;color:#2e61f4;font-size:21px}
.st-role-transition-note{font-size:12px;color:#7587a5;margin:0}
body.st-role-leaving .st-side,body.st-role-leaving .top,body.st-role-leaving .container{opacity:.36;transform:translateY(5px)}
body.st-role-entering .st-side,body.st-role-entering .top,body.st-role-entering .container{opacity:.52;transform:translateY(4px)}
body.st-role-switching .st-side,body.st-role-switching .top,body.st-role-switching .container{transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
#app.st-page-arrive{animation:st-page-arrive .18s ease-out both}
@keyframes st-page-arrive{from{opacity:.56;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:850px){.device-grid.st-two-options{grid-template-columns:repeat(2,minmax(0,1fr))}.device-grid.st-two-options .device-card{min-height:230px}}

function fabricateData(){
 // Profils fictifs stables dans chaque niveau. Chaque réponse est attribuée
 // à un code précis (129 / 181 / 266 / 341 questions). En 3e, les 24 items
 // du socle Maîtrise sont renseignés individuellement.
 const baseline=[];
 [[20,4,24],[61,27,49],[64,52,74],[35,78,99]].forEach(([count,lo,hi])=>{for(let i=0;i<count;i++)baseline.push(rand(lo,hi))});
 for(let i=baseline.length-1;i>0;i--){const j=rand(0,i);[baseline[i],baseline[j]]=[baseline[j],baseline[i]]}
 return CLASSES.flatMap((cls,ci)=>Array.from({length:30},(_,ix)=>{
  const idx=ci*30+ix,foundBase=baseline[idx],consBase=clamp(Math.round(foundBase+rand(-20,19)),3,100);
  const weak=new Set([rand(0,NOTIONS.length-1),rand(0,NOTIONS.length-1),rand(0,NOTIONS.length-1)]);
  const answers=Object.create(null);
  for(let s=0;s<SOCLE_KEYS.length;s++){
   const scope=ACTIVE_QUESTIONS.filter(q=>q.socle===SOCLE_KEYS[s]);
   if(!scope.length)continue; // Ne change aucun tirage de 6e/5e (0 question Maîtrise).
   const targetRate=s===0?foundBase:s===1?consBase:clamp(consBase+rand(-20,15),0,100);
   const target=clamp(Math.round(scope.length*targetRate/100),0,scope.length);
   // Une question d'une notion fragile est moins souvent réussie ; celles
   // d'origine 6e sont légèrement plus difficiles dans ce jeu fictif.
   const weighted=scope.map(q=>({code:q.code,rank:rnd()*85+(weak.has(NOTIONS.findIndex(n=>n[0]===q.notionCode))?-23:0)+((q.origin==='6e'||q.origin==='5e')?-7:0)+((q.code.charCodeAt(q.code.length-1)%5)-2)*1.5}));
   weighted.sort((a,b)=>b.rank-a.rank||a.code.localeCompare(b.code));
   for(let i=0;i<weighted.length;i++)answers[weighted[i].code]=i<target;
  }
  const counts=NOTIONS.map(n=>SOCLE_KEYS.map(s=>ACTIVE_QUESTIONS.filter(q=>q.notionCode===n[0]&&q.socle===s).reduce((a,q)=>a+(answers[q.code]===true?1:0),0)));
  const correctBySocle=SOCLE_KEYS.map((s,j)=>counts.reduce((v,c)=>v+c[j],0));
  const scores=TOTAL_PER_SOCLE.map((n,i)=>n?Math.round(100*correctBySocle[i]/n):0);
  const topicRates=NOTIONS.map((n,j)=>Math.round(100*counts[j].reduce((a,b)=>a+b,0)/n[2]));
  const globalCorrect=correctBySocle.reduce((a,b)=>a+b,0);
  const needs=NOTIONS.map((n,j)=>{const correct=counts[j].reduce((a,b)=>a+b,0),rate=100*correct/n[2];return {j,rate,missing:n[2]-correct,severity:(1-rate/100)*(.3+.7*n[2]/(n[2]+5))}}).filter(x=>x.rate<75).sort((a,b)=>b.severity-a.severity||b.missing-a.missing).map(x=>x.j);
  return {id:`E${String(idx+1).padStart(3,'0')}`,name:`${NAMES[(idx*7+ci*3)%30]} ${SURNAMES[(idx*11+ci*5)%30]}`,classId:cls,answers,correctBySocle,globalCorrect,globalRate:100*globalCorrect/ACTIVE_QUESTIONS.length,scores,counts,topicRates,needs};
 }));
}

 const total=TOTAL_PER_SOCLE[s];return total?100*pupil.correctBySocle[s]/total:0;
}

function orderedStudents(pupils){return [...pupils].sort((a,b)=>edExactSocleScore(a,0)-edExactSocleScore(b,0)||edExactSocleScore(a,1)-edExactSocleScore(b,1)||edExactSocleScore(a,2)-edExactSocleScore(b,2)||a.id.localeCompare(b.id))}

function groupByNeeds(pupils,sizes){const ranked=orderedStudents(pupils);let offset=0;let groups=sizes.map(n=>{const a=ranked.slice(offset,offset+n);offset+=n;return a}); // Échanges limités à des élèves de niveau voisin, pour rapprocher les difficultés communes.
for(let pass=0;pass<2;pass++)for(let i=0;i<groups.length-1;i++){let a=groups[i],b=groups[i+1];let optsA=a.slice(-7),optsB=b.slice(0,7),best=null,bestGain=0;for(const x of optsA)for(const y of optsB){if(Math.abs(edExactSocleScore(x,0)-edExactSocleScore(y,0))>8)continue;const ar=a.filter(e=>e!==x),br=b.filter(e=>e!==y);let gain=(similarity(y,ar)+similarity(x,br))-(similarity(x,ar)+similarity(y,br));if(gain>bestGain){bestGain=gain;best=[x,y]}}if(best){const[x,y]=best;groups[i]=a.map(e=>e===x?y:e);groups[i+1]=b.map(e=>e===y?x:e)}}return groups}
function heteroGroups(pupils,sizes){const groups=sizes.map(()=>[]),strata=[0,1,2,3].map(b=>pupils.filter(e=>rangeBand(edExactSocleScore(e,0))===b).sort((a,b)=>a.classId.localeCompare(b.classId)||a.id.localeCompare(b.id)));const total=pupils.length;const targetBand=Array.from({length:4},(_,b)=>strata[b].length);let step=0;for(let b=0;b<4;b++){let batch=strata[b]; // Parcours alterné et arbitrage pour représenter les classes d’origine dans chaque groupe.
if(b%2)batch=[...batch].reverse();for(const e of batch){let options=groups.map((g,i)=>({i,g})).filter(x=>x.g.length<sizes[x.i]);options.sort((a,b)=>{const cost=x=>{const g=x.g;const bandCount=g.filter(p=>rangeBand(edExactSocleScore(p,0))===b).length;const classCount=g.filter(p=>p.classId===e.classId).length;const targetB=targetBand[b]*sizes[x.i]/total;const targetC=pupils.filter(p=>p.classId===e.classId).length*sizes[x.i]/total;const deltaB=2*(bandCount-targetB)+1;const deltaC=2*(classCount-targetC)+1;return 4*deltaB+1.7*deltaC+0.3*(g.length/sizes[x.i]);};return cost(a)-cost(b)||a.g.length/sizes[a.i]-b.g.length/sizes[b.i]||((a.i+step)%sizes.length)-((b.i+step)%sizes.length)});groups[options[0].i].push(e);step++}}return groups}

function renderGroupCards(u,p,editable=false){const groups=getGroups(u,p),all=memberList(u),overall=resultsFor(all)[0];return `<div class="grid cols2">${groups.map((g,i)=>{const bands=resultsFor(g.pupils)[0],pupilN=g.pupils.length;return `<div class="groupcard"><div class="groupheader"><div><div class="groupname">${p.mode==='hetero'?`Groupe ${String.fromCharCode(65+i)}`:p.mode==='class'?`6e ${u.classIds[0]}`:`Groupe ${i+1}`}</div><div class="muted small">${groupProfile(g,p,i)}</div></div><span class="badge">${pupilN} élèves</span></div><div><div class="b tiny" style="margin-bottom:7px">Fondations — répartition des niveaux</div>${summaryBands(bands,{showLabels:false})}${p.mode==='hetero'?`<div class="muted tiny" style="margin:8px 0 6px">Comparaison avec la barrette :</div>${summaryBands(overall,{showLabels:false})}`:''}</div><div><div class="b small" style="margin-bottom:8px">${p.mode==='hetero'||p.mode==='class'?'Besoins pour différencier les activités':'Principaux besoins communs'}</div>${topicTags(g.pupils)}</div><details><summary class="link" style="font-size:13px">Voir les ${pupilN} élèves</summary><div style="margin-top:9px;max-height:310px;overflow-y:auto">${g.pupils.map(e=>`<div class="listpupil"><div class="medium"><strong>${esc(e.name)}</strong><div class="muted tiny">6e ${e.classId} · Fondations ${edDisplaySocleScore(e,0)} % · ${e.needs.length?NOTIONS[e.needs[0]][1]:'Acquis solides'}</div></div>${editable&&p.mode!=='class'?`<select class="field" style="width:120px;font-size:12px" aria-label="Changer le groupe de ${esc(e.name)}" data-move="${e.id}" data-from="${i}">${groups.map((_,z)=>`<option value="${z}" ${z===i?'selected':''}>Groupe ${z+1}</option>`).join('')}</select>`:''}</div>`).join('')}</div></details></div>`}).join('')}</div>`}
function pageProposal(){let u=currentUnit(),p=getPlan(u),gs=getGroups(u,p),N=memberList(u).length;return titlePage(p.mode==='class'?'Les besoins de cette classe':'Voici les groupes proposés par Stud’Éval',p.mode==='besoins'?'Les élèves sont regroupés selon leurs Fondations, puis selon leurs difficultés communes. Tous suivent le même programme de mathématiques.':p.mode==='hetero'?'Chaque groupe reflète la diversité des niveaux de la barrette. Les besoins fréquents aident les professeurs à différencier leurs activités.':'Stud’Éval ne modifie pas la classe. Les résultats aident le professeur à adapter le travail aux différents besoins.','Proposition pédagogique')+unitHeader()+`<div class="grid cols3" style="margin-bottom:18px"><div class="kpi"><div class="num">${N}</div><div class="lbl">Élèves concernés</div></div><div class="kpi"><div class="num">${gs.length}</div><div class="lbl">Groupes constitués</div></div><div class="kpi"><div class="num">${p.mode==='class'?0:budget(p,u).toLocaleString('fr-FR')} h</div><div class="lbl">Heures-professeur supplémentaires par semaine</div></div></div>${renderGroupCards(u,p)}<div class="spacer"></div>${info(p.mode==='class'?'La classe reste entière. Les analyses pédagogiques pourront être consultées par son professeur.':`Les élèves proviennent uniquement de <strong>${u.name.toLowerCase()}</strong>. La proposition pourra être ajustée par l'équipe pédagogique avant validation.`)}${nav('Revoir les paramètres','back-proposal',p.mode==='class'?'Prendre acte et continuer':'Transmettre au professeur référent','next-proposal')}`}
function pageHandoff(){let u=currentUnit(),p=getPlan(u);return titlePage('La proposition passe à l’équipe pédagogique','L’organisation est définie. Le professeur référent peut maintenant vérifier les élèves de chaque groupe et effectuer des ajustements.','Changement d’espace')+`<div class="card" style="max-width:790px;margin:auto"><div class="grid cols2"><div class="panel blue"><div class="badge">Direction</div><h2 class="card-title" style="margin-top:12px">Organisation fixée</h2><p class="medium muted">${u.name} · ${p.k} groupes · ${p.hours.toLocaleString('fr-FR')} h de maths en groupes par semaine.</p></div><div class="panel"><div class="badge">Professeur référent</div><h2 class="card-title" style="margin-top:12px">Vérification pédagogique</h2><p class="medium muted">Consulter la composition et proposer des échanges entre élèves, à l’intérieur de la barrette.</p></div></div><div class="spacer"></div>${btn('Accéder à l’espace professeur référent →','enter-teacher','btn',`style="width:100%"`)}</div>`}
function pageTeacher(){let u=currentUnit(),p=getPlan(u),gs=getGroups(u,p);return titlePage('Vérifier et harmoniser les groupes','Vous pouvez consulter les besoins de chaque groupe. Si nécessaire, déplacez un élève vers un autre groupe de la même barrette.','Espace professeur référent')+unitHeader()+`<div class="row" style="margin-bottom:14px;flex-wrap:wrap"><div class="muted medium">${gs.reduce((s,g)=>s+g.pupils.length,0)} élèves · ${gs.length} groupe${gs.length>1?'s':''} · ${p.adjustments} ajustement${p.adjustments>1?'s':''}</div>${p.mode!=='class'?btn('Revenir à la proposition initiale','reset-groups','btn secondary minor'):''}</div>${state.lastNotice?`<div class="notice" style="margin-bottom:12px">${state.lastNotice}</div>`:''}${renderGroupCards(u,p,true)}<div class="spacer"></div>${p.mode!=='class'?info('Les effectifs peuvent évoluer lors d’un déplacement. Vérifiez les besoins et la taille des groupes avant de soumettre la proposition. Un élève ne peut pas être placé dans une autre barrette.'):''}${nav('Retour à la proposition','back-teacher','Transmettre la proposition à la direction','submit-to-direction')}`}
function pageBackHandoff(){let u=currentUnit(),p=getPlan(u);return titlePage('La proposition retourne à la direction','Le professeur référent a vérifié les groupes. Le chef d’établissement peut maintenant confirmer leur organisation.','Changement d’espace')+`<div class="card" style="max-width:770px;margin:auto"><div class="grid cols2"><div class="panel"><div class="badge">Professeur référent</div><h2 class="card-title" style="margin-top:12px">Composition vérifiée</h2><div class="muted medium">${p.adjustments} ajustement${p.adjustments>1?'s':''} · ${u.name}</div></div><div class="panel blue"><div class="badge">Direction</div><h2 class="card-title" style="margin-top:12px">Validation finale</h2><div class="muted medium">Nombre de groupes, moyens et effectifs à confirmer.</div></div></div><div class="spacer"></div>${btn('Examiner la proposition →','enter-validation','btn',`style="width:100%"`)}</div>`}
function pageValidation(){let u=currentUnit(),p=getPlan(u),groups=getGroups(u,p),total=groups.reduce((s,g)=>s+g.pupils.length,0),need=budget(p,u);return titlePage('Valider l’organisation de cette barrette','Voici les groupes constitués et les moyens que le collège mobilisera.','Retour chef d’établissement')+unitHeader()+`<div class="card" style="max-width:880px;margin:auto"><div class="grid cols3"><div class="kpi"><div class="num">${total}</div><div class="lbl">Élèves répartis</div></div><div class="kpi"><div class="num">${p.k}</div><div class="lbl">Groupes ouverts</div></div><div class="kpi"><div class="num">${need.toLocaleString('fr-FR')} h</div><div class="lbl">Heures supplémentaires / semaine</div></div></div><div class="hr"></div><div class="stat-row"><span>Organisation</span><strong>${p.mode==='besoins'?'Groupes selon les besoins':p.mode==='hetero'?'Groupes hétérogènes':'Classe entière'}</strong></div><div class="stat-row"><span>Mathématiques organisées en groupes</span><strong>${p.mode==='class'?'0':p.hours.toLocaleString('fr-FR')} h / 4,5 h</strong></div><div class="stat-row"><span>Enseignants et salles disponibles</span><strong>${p.teachers} · ${p.rooms}</strong></div>${need?`<div class="stat-row"><span>Origine déclarée des moyens supplémentaires</span><strong>${esc(p.source)}</strong></div>`:''}<div class="hr"></div>${groups.map((g,i)=>`<div class="stat-row"><span>Groupe ${i+1} · ${g.pupils.length} élèves</span><span class="muted small">${topNeeds(g.pupils,2).map(n=>n.name).join(' · ')}</span></div>`).join('')}<div class="spacer"></div>${total!==memberList(u).length?'<div class="danger">La totalité des élèves n’est pas répartie. Vérifiez les affectations.</div>':meansIssues(u,p).length?'<div class="danger">Les moyens déclarés ne sont plus suffisants : vérifiez-les avant validation.</div>':'<div class="success">Tous les élèves sont affectés dans leur barrette. Les moyens déclarés permettent cette organisation.</div>'}</div>${nav('Demander un ajustement','return-to-teacher','Valider cette barrette','approve-unit',total!==memberList(u).length||!!meansIssues(u,p).length)}`}
function pageDone(){let us=units(),u=currentUnit();return titlePage('Organisation enregistrée',`La proposition de ${u.name.toLowerCase()} a été validée dans cette démonstration. Vous pouvez continuer avec la barrette suivante.`,'Validation')+`<div class="card" style="max-width:750px;margin:auto"><div class="success" style="text-align:center;font-weight:750">✓ ${u.name} · Groupes validés</div><div class="spacer"></div><div class="grid cols2"><div class="kpi"><div class="num">${getPlan(u).k}</div><div class="lbl">Groupes organisés</div></div><div class="kpi"><div class="num">${memberList(u).length}</div><div class="lbl">Élèves concernés</div></div></div>${nav('Retour aux barrettes','back-overview',allValidated()?'Consulter la synthèse':'Préparer l’unité suivante',allValidated()?'go-summary':'next-unit')}</div>`}
function pageSummary(){let us=units(),extra=us.reduce((s,u)=>s+(getPlan(u).validated?budget(getPlan(u),u):0),0);return titlePage('Synthèse des groupes de sixième','Toutes les répartitions retenues sont réunies ici. Vous pouvez les imprimer ou exporter les listes d’élèves.','Organisation validée')+`<div class="grid cols3" style="margin-bottom:20px"><div class="kpi"><div class="num">180</div><div class="lbl">Élèves de sixième</div></div><div class="kpi"><div class="num">${us.reduce((s,u)=>s+getPlan(u).k,0)}</div><div class="lbl">Groupes organisés</div></div><div class="kpi"><div class="num">${extra.toLocaleString('fr-FR')} h</div><div class="lbl">Heures-professeur supplémentaires par semaine</div></div></div><div class="card"><h2 class="card-title">Organisation par barrette</h2><div class="grid cols2">${us.map(u=>{let p=getPlan(u);return `<div class="panel"><div class="row"><strong>${u.name}</strong><span class="badge ${p.validated?'ok':''}">${p.validated?'Validée':'À préparer'}</span></div><div class="muted small" style="margin:6px 0">${u.classIds.map(c=>'6e '+c).join(' · ')}</div><div class="stat-row"><span>Organisation</span><strong class="small">${p.mode==='besoins'?'Besoins proches':p.mode==='hetero'?'Hétérogène':'Classe entière'}</strong></div><div class="stat-row"><span>Groupes / élèves</span><strong>${p.k} / ${memberList(u).length}</strong></div><div class="stat-row"><span>Heures supplémentaires</span><strong>${budget(p,u).toLocaleString('fr-FR')} h/sem.</strong></div></div>`}).join('')}</div><div class="hr"></div>${info('Les groupes de besoins sont évolutifs. Après une nouvelle évaluation, Stud’Éval pourra proposer des ajustements que l’équipe pédagogique vérifiera.')}</div><div class="actions">${btn('← Revoir les barrettes','back-overview','btn secondary')}<div class="row" style="flex-wrap:wrap">${btn('Exporter les listes CSV','export-csv','btn secondary')}${btn('Imprimer / exporter en PDF','print-summary')}</div></div>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  return `<header class="hero guided-hero">
    ${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}

    ${subtitle ? `<p>${subtitle}</p>` : ''}
  </header>`;
}
function nav(backLabel,backAction,nextLabel,nextAction,disabled=false){
  return `<div class="actions guided-actions">
    ${backLabel?btn(`← ${backLabel}`,backAction,'btn secondary'):''}

}

</div>`}

function meansStatus(u,p,issues){
  const n=u.classIds.length;
  if(!issues.length)return `<div class="success">✓ Organisation envisageable : ${p.k} enseignants, ${p.k} salles et créneaux alignés, sous réserve de leur disponibilité effective.</div>`;
  const items=[];
  if(issues.includes('teachers'))items.push(`<div class="fix-issue"><strong>Il manque ${p.k-p.teachers} enseignant${p.k-p.teachers>1?'s':''} sur ce créneau.</strong><p>Vous pouvez ouvrir moins de groupes ou confirmer un enseignant supplémentaire réellement disponible.</p><div class="fix-actions">${btn(`Revenir à ${n} groupes`,'back-to-basic','btn secondary minor')}${btn('Confirmer un enseignant de plus','teach-plus','btn secondary minor')}</div></div>`);
  if(issues.includes('rooms'))items.push(`<div class="fix-issue"><strong>Il manque ${p.k-p.rooms} salle${p.k-p.rooms>1?'s':''}.</strong><p>Prévoyez une salle supplémentaire ou revenez à une organisation moins exigeante.</p><div class="fix-actions">${btn('Confirmer une salle de plus','room-plus','btn secondary minor')}</div></div>`);
  if(issues.includes('aligned'))items.push(`<div class="fix-issue"><strong>Ces classes ne sont pas sur un créneau de mathématiques commun.</strong><p>Pour former des groupes ensemble, elles doivent être alignées dans l’emploi du temps.</p><div class="fix-actions">${btn('Revoir les barrettes','back-to-barrettes','btn secondary minor')}${btn('Traiter les classes séparément','split-barrette','btn secondary minor')}</div></div>`);
  return items.join('');
}

function remTopicSequence(chosen){
  const requested=clamp(rem.notions,1,Math.min(rem.k,NOTIONS.length));
  const topics=remCandidateTopicOrder(chosen).slice(0,requested);
  if(!topics.length)return [];
  const demanded=topics.map(t=>({j:t.j,nom:t.nom,demand:chosen.reduce((v,x)=>v+(x.options.slice(0,3).some(o=>o.j===t.j)?1:0),0)}));
  const counts=Array(demanded.length).fill(1);
  for(let n=demanded.length;n<rem.k;n++){
    let best=0;
    for(let j=1;j<counts.length;j++){
      const a=demanded[j].demand/counts[j],b=demanded[best].demand/counts[best];

 if(!plan.groups.length||count<rem.k*2)throw Error('Pas assez d’élèves concernés par les notions visées pour former les groupes. Réduisez le nombre de groupes ou augmentez celui des notions.');
 const groups=plan.groups.map((g,i)=>({id:`R${rem.phases.length+1}-${i+1}`,notion:g.notion,pupils:manual?[]:g.pupils.slice(),target:g.target}));
 if(!manual){
   const len=groups.map(g=>g.pupils.length),gap=Math.max(...len)-Math.min(...len);
   if(gap>3)throw Error('La composition entraînerait des effectifs trop différents. Essayez davantage de notions ou moins de groupes.');
 }
 const selectedIds=plan.groups.flatMap(g=>g.pupils.map(x=>x.id));
 return{groups,selectedIds,method:manual?'manuel':'auto',targetCount:count,groupCount:rem.k,hours:remHoursNeeded(),createdAt:Date.now()};
}
function remValidProposal(p=rem.proposal){if(!p)return ['Aucune proposition n’a encore été préparée.'];
  const problems=[],groups=p.groups,ids=groups.flatMap(g=>g.pupils.map(x=>x.id)),seen=remSeen();
  if(groups.length!==rem.k)problems.push(`Il faut exactement ${rem.k} groupes.`);
  if(new Set(ids).size!==ids.length)problems.push('Un élève figure dans plusieurs groupes.');
  for(const g of groups){
    if(g.pupils.length<2)problems.push(`Le groupe « ${NOTIONS[g.notion][1]} » doit contenir au moins 2 élèves.`);
    if(g.pupils.some(p=>seen.get(p.id).has(g.notion)))problems.push('Une notion déjà travaillée figure dans un groupe.');
  }
  const sizes=groups.map(g=>g.pupils.length),gap=Math.max(...sizes)-Math.min(...sizes);
  if(gap>3)problems.push(`Les effectifs sont trop éloignés (${Math.min(...sizes)} à ${Math.max(...sizes)} élèves). Écart maximal accepté : 3.`);
  if(p.hours>remAvail())problems.push('Le volume horaire dépasse les heures encore disponibles.');
  if(p.hours+rem.reserve>remAvail())problems.push('La réserve d’heures que vous souhaitez conserver ne serait pas respectée.');
  if(new Set(groups.map(g=>g.notion)).size>rem.notions)problems.push(`Vous avez demandé ${rem.notions} notion(s) différentes au maximum pendant cette phase.`);
  return [...new Set(problems)];
}
function remGroupMatches(g){let strong=0;for(const p of g.pupils){const opt=remTopics(p,remSeen().get(p.id));if(opt.slice(0,3).some(x=>x.j===g.notion))strong++}return strong}

  const seen=remSeen(),used=new Set(rem.proposal.groups.flatMap(x=>x.pupils.map(p=>p.id))),other=PUPILS.filter(p=>!used.has(p.id)&&!seen.get(p.id).has(g.notion));

  return `<section class="rem-group"><div class="groupheader"><div><div class="rem-faint">Groupe ${i+1} · Une seule notion</div><h3>${esc(NOTIONS[g.notion][1])}</h3></div><span class="badge">${g.pupils.length} élèves</span></div>
  <div class="rem-audit-note">${remGroupMatches(g)} élève${remGroupMatches(g)>1?'s':''} sur ${g.pupils.length} ont cette notion parmi leurs trois difficultés prioritaires.</div>
  ${top.length&&g.pupils.length?`<div class="need-stat"><div class="rem-faint" style="margin-bottom:8px">Autres besoins fréquents dans ce groupe</div><div class="tagline">${top.map(t=>`<span class="tag">${esc(t.name)} · ${t.n} élèves</span>`).join('')}</div></div>`:''}
  ${editable&&isManual?`<div style="margin-top:14px"><label class="fieldlabel">Notion travaillée</label><select data-rem-topic="${i}" class="field">${NOTIONS.map((n,j)=>`<option value="${j}" ${j===g.notion?'selected':''}>${esc(n[1])}</option>`).join('')}</select><label class="fieldlabel" style="margin-top:12px">Ajouter un élève à ce groupe</label><select data-rem-add="${i}" class="field"><option value="">Choisir un élève…</option>${other.sort((a,b)=>a.topicRates[g.notion]-b.topicRates[g.notion]).map(p=>`<option value="${p.id}">${esc(p.name)} · 6e ${p.classId} · ${p.topicRates[g.notion]} %</option>`).join('')}</select></div>`:''}
  <details class="pupil-details" data-rem-details="${i}" ${opened?'open':''}><summary>Voir les élèves ${editable?'et ajuster les affectations':''}</summary><div class="pupil-scroll">${g.pupils.map(p=>`<div class="rem-item"><div><strong>${esc(p.name)}</strong><small>6e ${p.classId} · ${p.topicRates[g.notion]} % sur cette notion</small></div>${editable?`<select data-rem-move="${p.id}" data-from="${i}" aria-label="Changer le groupe de ${esc(p.name)}"><option value="${i}">Dans ce groupe</option>${rem.proposal.groups.map((gg,j)=>j!==i&&!seen.get(p.id).has(gg.notion)?`<option value="${j}">Vers groupe ${j+1} : ${esc(NOTIONS[gg.notion][1])}</option>`:'').join('')}${isManual?'<option value="remove">Retirer de cette phase</option>':''}</select>`:''}</div>`).join('')||'<p class="muted small">Aucun élève dans ce groupe.</p>'}</div></details></section>`;
}

function remHashText(s){let h=2166136261;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),16777619)>>>0;}return h>>>0}
function remSubsFor(j){return REM_SUBS_BY_CODE[NOTIONS[j][0]]||[]}
function remDetails(p,j){

 if(remDetailsCache.has(id))return remDetailsCache.get(id);
 const code=NOTIONS[j][0],subs=remSubsFor(j),fCodes=subs.flatMap(s=>s.fCodes),denom=fCodes.length;
 const sourceTotal=QUESTION_BLOCKS[j][0],sourceCorrect=p.counts[j][0];
 let correct=denom?Math.round((sourceTotal?sourceCorrect/sourceTotal:p.topicRates[j]/100)*denom):0;
 if(rem.demoScenario==='trois'&&code==='NUM'){
  const ix=Number(p.id.slice(1));
  correct=ix<=3?[5,8,11][ix-1]:Math.max(Math.floor(denom/2)+1,correct);
 }
 if(rem.demoScenario==='trois'&&code==='FRA'){
  const ix=Number(p.id.slice(1));
  if(ix>=4&&ix<=35)correct=Math.min(Math.floor(denom/2),correct);
 }
 correct=clamp(correct,0,denom);
 // Affecter des réponses correctes à des codes bien identifiés, et non des
 // scores inventés par sous-notion indépendamment du résultat Fondations.
 const sorted=fCodes.slice().sort((a,b)=>remHashText(p.id+'|'+a)-remHashText(p.id+'|'+b));
 const right=new Set(sorted.slice(0,correct));

   const f=s.fCodes.length,ok=s.fCodes.reduce((n,c)=>n+(right.has(c)?1:0),0);
   return{name:s.name,priority:Math.max(0,priority.indexOf(s.name)),denominator:f,correct:ok,score:f?100*ok/f:null};
 });
 const weak=breakdown.filter(s=>s.denominator>0&&s.score<=50).sort((a,b)=>a.priority-b.priority||a.score-b.score);
 const ranked=breakdown.filter(s=>s.denominator>0).sort((a,b)=>a.score-b.score||a.priority-b.priority);
 const focus=weak[0]||ranked[0]||{name:'À préciser',priority:99,score:100};
 const r={score:denom?100*correct/denom:100,correct,total:denom,breakdown,focus};
 remDetailsCache.set(id,r);return r;

function remScore(p,j){return remDetails(p,j).score}
function remIsEligible(p,j,seen){return remScore(p,j)<=50&&!(seen?.get(p.id)?.has(j))}
function remCompare(a,b,j){const x=remDetails(a,j),y=remDetails(b,j);

remTopics=function(p,seen){return REM_PRIORITY.map(j=>({j,nom:NOTIONS[j][1],score:remScore(p,j),band:rangeBand(remScore(p,j))}))

remBandsByStudent=function(){const result=[0,0,0,0];remGetAvailable().forEach(x=>result[rangeBand(Math.min(...x.options.map(t=>t.score)))]++);return result};
remRanks=function(){const seen=remSeen();return [0,1,2,3].map(b=>REM_PRIORITY.map(j=>{const pool=PUPILS.filter(p=>remIsEligible(p,j,seen)&&rangeBand(remScore(p,j))===b);return{j,band:b,nom:NOTIONS[j][1],score:pool.length?mean(pool.map(p=>remScore(p,j))):100,count:pool.length}}).filter(t=>t.count))};

function remBalanceAdd(groups,used,seen,desired,maxSize){
 let count=groups.reduce((s,g)=>s+g.pupils.length,0),guard=0;
 while(count<desired&&guard++<300){
  const lo=Math.min(...groups.map(g=>g.pupils.length)),choices=[];
  for(const g of groups){

    const pool=PUPILS.filter(p=>!used.has(p.id)&&remIsEligible(p,g.notion,seen)).sort((a,b)=>remCompare(a,b,g.notion));
    if(pool.length)choices.push({g,p:pool[0]});
  }
  if(!choices.length)break;
  choices.sort((a,b)=>a.g.pupils.length-b.g.pupils.length||REM_PRIORITY_RANK.get(a.g.notion)-REM_PRIORITY_RANK.get(b.g.notion)||remCompare(a.p,b.p,a.g.notion));

function remPickAttempt(st,j,n,pool,minSize,target){
 const chosen=pool.slice(0,Math.min(pool.length,n*target));
 if(chosen.length<n*minSize)return null;
 const copies=st.groups.map(g=>({notion:g.notion,pupils:g.pupils.slice(),target:g.target}));
 const sizes=equalSizes(chosen.length,n);let ix=0;
 for(const size of sizes){if(size<minSize)return null;copies.push({notion:j,pupils:chosen.slice(ix,ix+size),target});ix+=size;}

function remBestPlan(){

  const candidates=[];

   candidates.push(st); // Reporter cette notion est permis en cas de blocage.
   const slots=k-st.groups.length;
   if(slots<1)continue;
   const pool=PUPILS.filter(p=>!st.used.has(p.id)&&remIsEligible(p,j,seen)).sort((a,b)=>remCompare(a,b,j));
   const cap=Math.min(slots,Math.floor(pool.length/lo));
   if(cap<1)continue;
   const ideal=Math.min(cap,Math.max(1,Math.ceil(pool.length/target)));
   const amounts=new Set([1,ideal,ideal-1,ideal+1,cap,Math.min(slots,Math.ceil(pool.length/hi))]);
   for(const n of amounts){if(n<1||n>cap)continue;
    const next=remPickAttempt(st,j,n,pool,lo,target);
    if(next)candidates.push(next);
   }
  }
  // Beam par nombre de groupes : une option précoce ne doit pas supprimer
  // toutes les alternatives nécessaires pour remplir exactement k groupes.
  const byCount=new Map();
  for(const st of candidates){const n=st.groups.length,arr=byCount.get(n)||[];arr.push(st);byCount.set(n,arr)}
  beam=[];
  for(const [n,arr] of byCount){

   for(const st of arr){const sig=st.groups.map(g=>g.notion+':'+g.pupils.length).join('|');const old=unique.get(sig);if(!old||st.count>old.count||st.count===old.count&&st.quality>old.quality)unique.set(sig,st)}
   const diverse=Array.from(unique.values());diverse.sort((a,b)=>b.count-a.count||b.quality-a.quality);
   // Conserver des combinaisons distinctes de notions, même si elles
   // comptent temporairement une place de moins que les autres.
   const heads=new Map();

   beam.push(...keep);

remValidProposal=function(p=rem.proposal){
 if(!p)return ['Aucune proposition n’a encore été préparée.'];
 const issues=[],ids=p.groups.flatMap(g=>g.pupils.map(x=>x.id)),seen=remSeen();
 if(p.groups.length!==rem.k)issues.push(`Vous avez demandé exactement ${rem.k} groupes ; le calcul actuel en propose ${p.groups.length}. Aucun groupe artificiel n’a été ajouté. Ajustez les paramètres.`);
 if(new Set(ids).size!==ids.length)issues.push('Un élève figure dans plusieurs groupes.');

 for(const g of p.groups){
  if(g.pupils.length<2)issues.push(`Un groupe « ${NOTIONS[g.notion][1]} » comporte moins de deux élèves.`);
  if(g.pupils.length<low||g.pupils.length>high)issues.push(`Les effectifs doivent rester proches de l’objectif (${low} à ${high} élèves par groupe).`);
  if(g.pupils.some(x=>seen.get(x.id)?.has(g.notion)))issues.push('Un élève a déjà travaillé cette notion lors d’une phase terminée.');
  if(g.pupils.some(x=>remScore(x,g.notion)>50))issues.push(`Un élève dépasse le seuil de 50 % dans « ${NOTIONS[g.notion][1]} » : affectation interdite.`);
 }
 const sizes=p.groups.map(g=>g.pupils.length);
 if(sizes.length&&Math.max(...sizes)-Math.min(...sizes)>3)issues.push('Écart entre groupes supérieur à trois élèves.');

ll></div><div class="ed-sim-control"><label for="ed-sim-teachers">Enseignants disponibles <output data-ed-out="teachers">${d.teachers}</output></label><input id="ed-sim-teachers" data-ed-sim-range="teachers" type="range" min="0" max="${Math.max(8,d.k,d.teachers)}" step="1" value="${d.teachers}"><small><span data-ed-text="teachers-needed">${d.k}</span> nécessaires au même moment.</small></div><div class="ed-sim-control"><label for="ed-sim-rooms">Salles disponibles <output data-ed-out="rooms">${d.rooms}</output></label><input id="ed-sim-rooms" data-ed-sim-range="rooms" type="range" min="0" max="${Math.max(8,d.k,d.rooms)}" step="1" value="${d.rooms}"><small><span data-ed-text="rooms-needed">${d.k}</span> nécessaires au même moment.</small></div></div><div class="ed-sim-result"><div><div class="ed-info-line"><strong data-ed-text="distribution">Effectifs : ${d.sizes.join(' · ')} élèves</strong></div><div class="ed-info-line">Heures-professeur supplémentaires : <strong data-ed-text="extra">${edHourText(cost)} par semaine</strong></div></div><div id="ed-sim-status" class="ed-note ${edSimIssues(u,d).length?'error':'good'}">${edSimIssues(u,d).length?edSimIssues(u,d).map(esc).join(' '):'Les moyens déclarés permettent cette organisation.'}</div></div></section>`;
}
function edPageProposal(){
 const u=currentUnit(),p=getPlan(u);if(u.solo)return edLegacyProposal();
 const ctx=edGetDraft(u,p),d=ctx.draft,groups=edBuildSimGroups(u,ctx),issues=edSimIssues(u,d);

function edRefreshSimulator(){
 if(state.page!=='proposal'||!state.edDraft)return;
 const u=currentUnit(),ctx=state.edDraft,d=ctx.draft,N=memberList(u).length,issues=edSimIssues(u,d),groups=edBuildSimGroups(u,ctx),extra=Math.max(0,d.k-u.classIds.length)*d.hours;
 const groupEl=document.getElementById('ed-preview-groups');if(groupEl)groupEl.innerHTML=edProposedGroups(groups);
 const put=(key,val)=>document.querySelectorAll(`[data-ed-out="${key}"]`).forEach(el=>el.textContent=val);
 const putText=(key,val)=>document.querySelectorAll(`[data-ed-text="${key}"]`).forEach(el=>el.textContent=val);
 for(const key of ['k','first','hours','teachers','rooms']){
   const el=document.getElementById('ed-sim-'+key);if(!el)continue;
   const value=key==='first'?d.sizes[0]:d[key];
   if(key==='first'){const [min,max]=edSimFirstLimits(d,N);el.min=min;el.max=max;el.disabled=d.k===1}
   if(key==='teachers'||key==='rooms')el.max=Math.max(8,d.k,d[key]);
   el.value=value;put(key,key==='hours'?edHourText(d.hours):String(value));
 }
 putText('group-count',String(d.k));putText('group-hours',edHourText(d.hours));putText('teachers-needed',String(d.k));putText('rooms-needed',String(d.k));
 putText('distribution','Effectifs : '+d.sizes.join(' · ')+' élèves');putText('extra',edHourText(extra)+' par semaine');
 const status=document.getElementById('ed-sim-status');if(status){status.className='ed-note '+(issues.length?'error':'good');status.textContent=issues.length?issues.join(' '):'Les moyens déclarés permettent cette organisation.'}
 const accept=document.querySelector('[data-action="ed-sim-accept"]');if(accept)accept.disabled=issues.length>0;
 const title=document.querySelector('.ed-title');if(title)title.textContent=`Voici les ${d.k} groupes proposés par Stud’Éval`;
}

document.addEventListener('change',event=>{

 }else if(el.id==='ed-none'){state.edNoBarrettes=el.checked;state.confirmed=false;rerenderPreserve()}
});
document.addEventListener('input',event=>{
 const el=event.target,key=el.dataset.edSimRange;if(!key||state.page!=='proposal'||!state.edDraft)return;
 const u=currentUnit(),d=state.edDraft.draft,N=memberList(u).length,value=Number(el.value);if(!Number.isFinite(value))return;
 if(key==='k'){
  const n=clamp(Math.round(value),1,Math.floor(N/2));d.k=n;d.sizes=equalSizes(N,n);

 else return;
 edRefreshSimulator();
});

function edDisplaySocleScore(pupil,s){

 // À 75,3 %, afficher 75,3 et la couleur bleue, pas « 75 % » et la couleur bleue.
 return rangeBand(exact)!==rangeBand(rounded)?exact.toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1}):String(rounded);
}

const RV_FAMILIES=[
 {id:'nombres',name:'Comprendre et utiliser les nombres',codes:['NUM','FRA','PRO','MES',...(['4e','3e'].includes(CURRENT_LEVEL)?['PUI']:[])],desc:['4e','3e'].includes(CURRENT_LEVEL)?'Nombres et calculs · Fractions · Proportionnalité · Grandeurs et mesures · Puissances et racines':'Nombres et calculs · Fractions · Proportionnalité · Grandeurs et mesures'},

const rvCost=()=>rv.k*rvSessions();
const rvUsedFamilies=()=>{
 const m=new Map(PUPILS.map(p=>[p.id,new Set()]));
 for(const phase of rv.phases.filter(x=>x.status==='Terminée'||x.status==='En cours'))for(const g of phase.groups)for(const p of g.pupils){if(m.has(p.id))m.get(p.id).add(g.family);}

};
/* Le score familial ne dépend que des questions du socle des bases essentielles.
   Le résultat est une fraction exacte pour le seuil, non un % arrondi. */
function rvFamilyScore(p,fid){
 const fam=rvFam(fid),total=fam.indices.reduce((a,j)=>a+QUESTION_BLOCKS[j][0],0);
 const correct=fam.indices.reduce((a,j)=>a+p.counts[j][0],0);
 return total?100*correct/total:100;
}
function rvEligible(p,fid,seen=rvUsedFamilies()){
 return p.correctBySocle[0]*4<TOTAL_PER_SOCLE[0]*3 && rvFamilyScore(p,fid)<75 && !seen.get(p.id).has(fid);
}
function rvPool(fid,used=new Set()){
 const seen=rvUsedFamilies();
 return PUPILS.filter(p=>!used.has(p.id)&&rvEligible(p,fid,seen))
  .sort((a,b)=>rvFamilyScore(a,fid)-rvFamilyScore(b,fid)||edExactSocleScore(a,0)-edExactSocleScore(b,0)||a.id.localeCompare(b.id));
}
function rvStats(fid){const arr=rvPool(fid);return {count:arr.length,average:arr.length?mean(arr.map(p=>rvFamilyScore(p,fid))):100};}
/* Recommandation : les nombres d'abord, autres familles selon leurs moyennes.
   Le référent peut explicitement personnaliser les QUATRE positions. */
function rvRecommendedRanking(){
 const first=rvFam('nombres');
 return [first,...RV_FAMILIES.filter(f=>f.id!==first.id).sort((a,b)=>rvStats(a.id).average-rvStats(b.id).average||a.name.localeCompare(b.name,'fr'))];

function rvRanking(){
 const manual=rv.priorityOrder;
 if(Array.isArray(manual)&&manual.length===RV_FAMILIES.length&&new Set(manual).size===RV_FAMILIES.length&&manual.every(id=>rvFam(id)))return manual.map(id=>rvFam(id));

}
function rvSetPriorityOrder(ids){
 if(!Array.isArray(ids)||ids.length!==RV_FAMILIES.length||new Set(ids).size!==RV_FAMILIES.length||ids.some(id=>!rvFam(id)))return;

 const ids=rvRanking().map(f=>f.id),i=ids.indexOf(id),j=i+delta;

function rvSeriesLabel(n){return 'Séances de remédiation n° '+n;}

/* V8.2 : allocation globale de la remédiation.
   1. L'ordre pédagogique décide du maximum de GROUPES affectables à chaque famille.
   2. Pour chaque répartition des groupes, on cherche le plus grand effectif équilibré
      possible (objectif ±2, écart entre groupes <=3).
   3. Une vérification exacte des recouvrements entre familles (condition de Hall)
      évite les faux diagnostics d'impossibilité du calcul glouton.
   4. Les élèves sont choisis par score familial croissant, en préservant toutes les
      places nécessaires aux familles moins prioritaires.
   Aucun élève artificiel, ni duplication entre groupes, ni franchissement de seuil. */
function rvPlan(){
 const ranked=rvRanking(),poolLists=ranked.map(f=>rvPool(f.id)),target=rv.size;
 const minSize=Math.max(2,target-2),maxSize=target+2;

 for(let i=0;i<ranked.length;i++)for(const p of poolLists[i]){
  idToPerson.set(p.id,p);maskById.set(p.id,(maskById.get(p.id)||0)|(1<<i));
 }

 for(const mask of maskById.values())if(mask)masked[mask]++;
 const unionCount=maskById.size;
 const boundByMask=Array.from({length:16},(_,subset)=>masked.reduce((n,v,mask)=>n+((mask&subset)?v:0),0));
 function hall(demands,counts=masked){
  for(let subset=1;subset<16;subset++){
   let need=0,capacity=0;
   for(let i=0;i<4;i++)if(subset&(1<<i))need+=demands[i];
   if(need===0)continue;
   if(counts===masked)capacity=boundByMask[subset];
   else for(let mask=1;mask<16;mask++)if(mask&subset)capacity+=counts[mask];
   if(need>capacity)return false;
  }
  return true;
 }
 function findPlan(groupCount){
  const minimumTotal=groupCount*minSize;
  if(minimumTotal>unionCount)return null;
  const counts=[0,0,0,0];
  let answer=null;
  function visit(fi,remaining){
   if(answer)return;
   if(fi===3){
    counts[fi]=remaining;
    if(remaining*minSize>poolLists[fi].length)return;
    const maxTotal=Math.min(groupCount*target,unionCount);
    for(let total=maxTotal;total>=minimumTotal;total--){
     const sizes=equalSizes(total,groupCount),quota=[0,0,0,0];
     let pos=0;
     for(let i=0;i<4;i++)for(let x=0;x<counts[i];x++)quota[i]+=sizes[pos++];
     if(hall(quota)){
      answer={counts:[...counts],sizes,quota,total};return;
     }
    }
    return;
   }
   for(let n=Math.min(remaining,Math.floor(poolLists[fi].length/minSize));n>=0;n--){
    counts[fi]=n;visit(fi+1,remaining-n);if(answer)return;
   }
  }

 // Le nombre EXACT demandé est prioritaire. À défaut, montrer la meilleure
 // proposition partielle, sans permettre sa validation.
 let choice=null,groupCount=rv.k;

 }
 if(!choice)return {groups:[],hours:rvCost(),sessions:rvSessions(),k:rv.k,target,

 // À chaque sélection, laisser une solution aux familles suivantes.

  for(const person of poolLists[fi]){
   if(remainingDemands[fi]===0)break;
   if(taken.has(person.id))continue;
   const mask=maskById.get(person.id);
   availableMasks[mask]--;remainingDemands[fi]--;
   if(hall(remainingDemands,availableMasks)){
    selected[fi].push(person);taken.add(person.id);
   }else{

 for(let fi=0;fi<4;fi++){
  let offset=0;

   offset+=size;cursor++;

  priority:rv.priority,priorityOrder:ranked.map(f=>f.id),priorityCustomized:!!rv.priorityOrder,createdAt:Date.now()};

function rvCheck(plan=rv.proposal){

 }
 if(groups.length){const sizes=groups.map(g=>g.pupils.length);if(Math.max(...sizes)-Math.min(...sizes)>3)issues.push('L’écart entre le plus petit et le plus grand groupe dépasse 3 élèves.');}

document.addEventListener('change',event=>{
 const t=event.target;
 if(t.id==='rv-annual-input'){const n=Number(t.value);if(Number.isFinite(n)){rv.annual=clamp(Math.round(n),Math.max(1,rvTotalEngaged()),2000);rv.budget=Math.min(rv.budget,rvAvailable());rv.k=Math.min(rv.k,Math.max(1,rv.budget));rvResetProposal();rerenderPreserve()}}
 if(t.id==='rv-student-sort'){rv.sort=t.value;rerenderPreserve()}
 if(t.id==='rv-director-confirm'){rv.confirmed=t.checked;rerenderPreserve()}
 if(t.dataset.rvMove!==undefined && state.page==='rv-teacher' && rv.proposal){
  const id=t.dataset.rvMove,from=Number(t.dataset.from),dest=Number(t.value),src=rv.proposal.groups[from],dst=rv.proposal.groups[dest];
  if(!src||!dst||from===dest)return;
  const ix=src.pupils.findIndex(p=>p.id===id);if(ix<0)return;
  const p=src.pupils[ix];
  if(!rvEligible(p,dst.family)){rv.notice='Impossible : cet élève ne répond pas aux critères du domaine du groupe choisi.';rerenderPreserve();return}
  const lengths=rv.proposal.groups.map(g=>g.pupils.length);lengths[from]--;lengths[dest]++;
  if(lengths[from]<2||Math.max(...lengths)-Math.min(...lengths)>3){rv.notice='Déplacement impossible : l’écart entre le plus petit et le plus grand groupe dépasserait 3 élèves, ou un groupe deviendrait trop petit.';rerenderPreserve();return}
  src.pupils.splice(ix,1);dst.pupils.push(p);rv.selectedGroup=dest;rv.notice=`${p.name} a été déplacé vers le groupe ${dest+1}.`;rerenderPreserve();
 }

function stRoleForPage(page){
 if(RV_PROF_PAGES.has(page)||page==='teacher'||page==='backHandoff')return 'prof';

}

// Le panneau de transition reste hors de #app, pour survivre à son remplacement.
const stHandoffOverlay=document.createElement('div');
stHandoffOverlay.className='st-role-transition';
stHandoffOverlay.id='st-role-transition';
stHandoffOverlay.setAttribute('role','status');
stHandoffOverlay.setAttribute('aria-live','polite');
stHandoffOverlay.setAttribute('aria-atomic','true');
document.body.appendChild(stHandoffOverlay);
const stGoBeforeRoleFade=go;
// V5.1 : lisibilité du passage de rôle (~3 s au total : fondu, pause, puis fondu).
// Les trois délais sont centralisés pour faciliter l'ajustement dans Stud’Éval.
const stRoleFadeTiming={beforeSwitch:1900,afterSwitch:420,fadeOut:760};
let stRoleTransitionPending=false;
function stPageArrive(){
 const app=document.getElementById('app');if(!app)return;
 app.classList.remove('st-page-arrive');void app.offsetWidth;app.classList.add('st-page-arrive');
 window.setTimeout(()=>app.classList.remove('st-page-arrive'),220);
}
go=function(nextPage){
 if(stRoleTransitionPending)return;
 const from=stRoleForPage(state.page),to=stRoleForPage(nextPage);
 if(from===to){stGoBeforeRoleFade(nextPage);stPageArrive();return;}
 const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
 if(reduced){stGoBeforeRoleFade(nextPage);return;}
 stRoleTransitionPending=true;
 stHandoffOverlay.innerHTML=`<div class="st-role-transition-card"><span class="st-role-transition-eyebrow">Changement d’espace · Démonstration</span><div class="st-role-transition-flow"><span class="st-role-from">${stRoleText(from)}</span><span class="st-role-transition-arrow" aria-hidden="true">→</span><span class="st-role-to">${stRoleText(to)}</span></div><p class="st-role-transition-note">Les informations restent dans ce prototype, sans transmission réelle.</p></div>`;
 document.body.classList.add('st-role-switching','st-role-leaving');
 stHandoffOverlay.classList.add('is-visible');
 // L'ancien écran s'estompe; le sens de la transition reste lisible avant le changement.
 window.setTimeout(()=>{
  try{
   stGoBeforeRoleFade(nextPage);
   document.body.classList.remove('st-role-leaving');
   document.body.classList.add('st-role-entering');
   window.requestAnimationFrame(()=>window.requestAnimationFrame(()=>document.body.classList.remove('st-role-entering')));
  }finally{
   // Le nouvel écran apparaît progressivement derrière la carte de passage.
   window.setTimeout(()=>{
    stHandoffOverlay.classList.remove('is-visible');
    document.body.classList.remove('st-role-entering','st-role-leaving');
    // Ne réautoriser la navigation qu'une fois le fondu sortant terminé.
    window.setTimeout(()=>{
     document.body.classList.remove('st-role-switching');
     stHandoffOverlay.innerHTML='';
     stRoleTransitionPending=false;
    },stRoleFadeTiming.fadeOut);
   },stRoleFadeTiming.afterSwitch);
  }
 },stRoleFadeTiming.beforeSwitch);
};

 const total=state.confirmed?units().length:0;
 if(total>0&&valid===total)return {code:'validated',label:'Validés'};
 if(begun){

 }

  const completed=needs.code==='validated'&&rem.code==='completed';
  const mainStatus=inProgress?'En cours':completed?'Organisations suivies':needs.code==='validated'?'Besoins validés':rem.code==='completed'?'Remédiation réalisée':'À organiser';
  const good=completed||(!inProgress&&(needs.code==='validated'||rem.code==='completed'));
  return `<article class="st82-level-card" aria-label="${name}">
   <div class="st82-level-header"><span class="st82-level-number">${level}</span><span class="st82-state ${good?'st82-state-good':''}">${mainStatus}</span></div>
   <h2>${name}</h2><p class="st82-roster">180 élèves · 6 classes</p>
   <div class="st82-status-rows">
    <div><span>Évaluation</span><strong>Terminée</strong></div>
    <div><span>Groupes de besoins</span><strong>${needs.label}</strong></div>
    <div><span>Remédiation</span><strong>${rem.label}</strong></div>
   </div>
   <button type="button" class="btn st82-main-action" data-action="st82-level-main" data-level="${level}">Accéder au niveau →</button>
  </article>`;
 }).join('');
 return edScreen({step:'Année scolaire 2026–2027 · Espace direction',title:'Organiser les groupes en mathématiques',lead:'Retrouvez l’avancement de chaque niveau et accédez à l’organisation souhaitée.',content:`<div class="st82-home-grid">${cards}</div><p class="rv-micro" style="margin:13px 0 0">Démonstration avec 180 élèves fictifs évalués par niveau. Les états reflètent les actions effectuées dans ce navigateur.</p>`});
};
// Second écran du parcours : choix entre les deux dispositifs, avec statut et reprise.
PAGES.device=function(){
 const needs=st82NeedsStatus(),rem=st82RemStatus();
 const needsAction=needs.code==='validated'?'Consulter les groupes validés':needs.code==='started'?'Reprendre les groupes de besoins':'Préparer les groupes de besoins';
 const remAction=rem.code==='active'?'Consulter les séances prévues':rem.code==='completed'?'Consulter les remédiations':rem.code==='started'?'Reprendre la remédiation':'Préparer la remédiation';
 const statusClass=code=>code==='validated'||code==='completed'?'is-done':code==='started'||code==='active'?'is-progress':'is-empty';
 const card=(number,title,description,status,action,buttonText)=>`<article class="device-card available st83-device-card"><div class="st83-card-top"><div class="device-icon">${number}</div><span class="st83-device-status ${statusClass(status.code)}">${esc(status.label)}</span></div><h2>${title}</h2><p>${description}</p><div class="device-bottom">${btn(buttonText+' →',action)}</div></article>`;
 const lead=['4e','3e'].includes(CURRENT_LEVEL)?'Deux dispositifs facultatifs à organiser selon les besoins de votre établissement.':'Choisissez un dispositif pour le préparer ou reprendre une organisation déjà commencée.';
 return titlePage(`Comment souhaitez-vous accompagner les ${LEVEL_PLURAL} ?`,lead,`${LEVEL_LONG} · 180 élèves évalués`)+
  `<div class="grid cols2 device-grid st-two-options st83-device-grid">`+
  card('①','Groupes de besoins','Répartir les élèves pendant les cours de mathématiques, selon leurs acquis.',needs,'device-yes',needsAction)+
  card('②','Groupes de remédiation','Organiser des séances ciblées sur les familles d’apprentissages insuffisamment acquises.',rem,'start-remediation',remAction)+
  `</div>`+nav('Retour aux niveaux','back-home',null,'none');
};
// Conserver le fonctionnement de l'anneau de réussite en consultation directe.
const st82PriorRender=render;
render=function(){
 if(ST82_NEEDS_PAGES.has(state.page)){
  state.st82NeedsVisited=true;state.st82LastNeedsPage=state.page;
 }
 if(RV_ALL_PAGES.has(state.page)){
  state.st82RemVisited=true;state.st82LastRemPage=state.page;
 }
 st82PriorRender();
 if(state.page==='results')document.title='Stud’Éval · Résultats · '+LEVEL_LONG;
 if(ST82_NEEDS_PAGES.has(state.page)){
  const overline=document.querySelector('#app .ed-overline');
  if(overline)overline.textContent=overline.textContent.replace(/Étape (\d+) sur 6/i,(_,v)=>'Étape '+(Number(v)-1)+' sur 5');
 }
 st82Save();
};
// La destination choisie depuis une autre carte est conservée lors du
// rechargement lié au changement de niveau scolaire.
const st82RequestedScreen=urlLevel.get('ecran');
if(st82RequestedScreen&&st82RequestedScreen!=='device'&&(RV_ALL_PAGES.has(st82RequestedScreen)||ST82_NEEDS_PAGES.has(st82RequestedScreen))){
 state.page=st82RequestedScreen;
 if(ST82_NEEDS_PAGES.has(state.page)&&!state.confirmed&&state.page!=='barrettes')state.page='barrettes';
 if(state.page==='rv-approved'&&!rvHasActiveTurn())state.page=rv.phases.length?'rv-history':'rv-results';
}
window.addEventListener('pagehide',st82Save);

/* V8.4 — REMÉDIATION UNIQUEMENT : présentation façon Stud’Éval de Jean-Louis.
 * Le parcours groupes de besoins et les moteurs de calcul restent intacts.
 * Ce supplément réutilise les actions et les données V8.3.
 */
const rvJLstages=['Priorités','Organisation','Moyens','Groupes','Validation'];
const rvJLpageIndex={
 'rv-results':0,'rv-time':1,
 'rv-hours':2,'rv-means':2,'rv-send':2,
 'rv-prof':3,'rv-budget':3,'rv-count':3,'rv-size':3,'rv-preview':3,'rv-teacher':3,
 'rv-to-director':4,'rv-validation':4,'rv-approved':4,'rv-history':4
};
const rvJLicon=`<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="13" y="3" width="6" height="7" rx="1.5"/><rect x="2.5" y="21" width="9" height="8" rx="2"/><rect x="20.5" y="21" width="9" height="8" rx="2"/><path d="M16 10v5M7 21v-6h18v6"/></svg>`;
function rvJLStepbar(page){
 const at=rvJLpageIndex[page]??0;
 return `<nav class="rv-jl-steps" aria-label="Avancement de l'organisation des remédiations">${rvJLstages.map((name,i)=>`<span class="rv-jl-step ${i<at?'done':i===at?'current':''}" ${i===at?'aria-current="step"':''}><span class="rv-jl-step-marker">${i<at?'✓':i+1}</span><span>${name}</span></span>`).join('')}</nav>`;
}
function rvJLsimplify(html){
 return String(html)
  .replaceAll('Familles', 'Domaines').replaceAll('familles', 'domaines')
  .replaceAll('Famille', 'Domaine').replaceAll('famille', 'domaine')
  .replaceAll('Famille prioritaire choisie','Domaine prioritaire choisi')
  .replaceAll('Réussite moyenne dans cette famille','Réussite moyenne dans ce domaine')
  .replaceAll('dans leur famille','dans le domaine concerné')
  .replaceAll('Pourquoi plusieurs groupes travaillent-ils le même domaine ?','Pourquoi plusieurs groupes sur un même domaine ?')
  .replaceAll('familles travaillées','domaines travaillés')
  .replaceAll('famille travaillée','domaine travaillé');
}
// La barre d'étapes plus ancienne n'est masquée QUE pour les pages de remédiation.
const rvJLoriginalStepper=stepper;
stepper=function(){return RV_ALL_PAGES.has(state.page)?'':rvJLoriginalStepper();};
rvScreen=function({title,lead='',eyebrow='',content='',footer='',detail=''}){
 const role=RV_PROF_PAGES.has(state.page)?'Professeur référent':'Chef d’établissement';
 const period=state.page==='rv-history'?'Suivi des remédiations':RV_PROF_PAGES.has(state.page)?rvSeriesLabel(rvRounds()):'Préparation des remédiations';
 return `<div class="rv-jl-workflow">
 <header class="rv-jl-hero"><div class="rv-jl-brand-icon">${rvJLicon}</div><div><strong>Création des groupes de remédiation</strong><p>Préparer des séances ciblées pour renforcer les acquis des élèves.</p></div></header>
 <div class="rv-jl-context"><span class="rv-jl-level-code">${CURRENT_LEVEL}</span><span class="rv-jl-context-main">Vous organisez la remédiation en ${LEVEL_LONG.toLowerCase()}</span><span class="rv-jl-context-meta">${PUPILS.length} élèves évalués</span><span class="rv-jl-context-role">${period} · ${role}</span></div>
 ${rvJLStepbar(state.page)}
 <section class="rv-screen"><div class="rv-head"><span class="rv-eyebrow">${eyebrow||'Groupes de remédiation'}</span><span>${detail||`${LEVEL_LONG} · ${role}`}</span></div><h1 class="rv-title">${title}</h1>${lead?`<p class="rv-lead">${rvJLsimplify(lead)}</p>`:''}${rvJLsimplify(content)}${footer}</section>
 </div>`;
};
// Écran d'ouverture : premier repère pédagogique puis ordre des autres domaines.
function rvJLDomainIcon(id){
 const marks={
  nombres:'<rect x="4" y="2" width="16" height="20" rx="2.5"/><rect x="7" y="5" width="10" height="4" rx=".6"/><path d="M8 13h2m4 0h2m-8 4h2m4 0h2"/>',
  relations:'<path d="m4 9 7 8m0-8-7 8M14 8h7M14 15h7"/>',
  espace:'<circle cx="8" cy="8" r="4"/><path d="m16 12 6 10H10z"/>',
  donnees:'<path d="M3 3v18h18M7 17v-5h3v5M12 17V8h3v9M17 17V5h3v12"/>'
 };
 return `<span class="rv-v87-domain-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false">${marks[id]||marks.nombres}</svg></span>`;
}
const RV_V87_INFO_ICON='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/></svg>';
const RV_V87_USERS_ICON='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M18 11a3 3 0 0 0-1-5.8M18 14a5 5 0 0 1 3 5v1"/></svg>';
const RV_V87_CHART_ICON='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20V12m6 8V7m6 13V4m4 16V10"/></svg>';
PAGES['rv-results']=function(){
 const eligible=PUPILS.filter(p=>p.correctBySocle[0]*4<TOTAL_PER_SOCLE[0]*3).length;
 const ordered=rvRecommendedRanking();
 const first=ordered[0], others=ordered.slice(1), primary=rvStats(first.id);
 return rvScreen({
  eyebrow:'REMÉDIATION · PRIORITÉS PÉDAGOGIQUES',detail:`${LEVEL_LONG} · ${PUPILS.length} élèves`,
  title:'Quels élèves accompagner en priorité ?',
  content:`<div class="rv-v87-flow" aria-label="Comment les élèves sont sélectionnés">
     <div class="rv-v87-step"><span class="rv-v87-step-symbol">${RV_V87_USERS_ICON}</span><div class="rv-v87-step-text"><strong>${PUPILS.length} élèves de ${LEVEL_LONG.toLowerCase()}</strong> ont passé l’évaluation.</div></div>
     <div class="rv-v87-step"><span class="rv-v87-step-symbol">${RV_V87_CHART_ICON}</span><div class="rv-v87-step-text">Parmi eux, <strong>${eligible} élèves</strong> ont obtenu <strong>moins de 75 % de réussite dans les bases essentielles</strong>, tous domaines confondus.</div></div>
    </div>
    <p class="rv-v87-explain">Stud’Éval regarde ensuite, <strong>parmi ces ${eligible} élèves</strong>, ceux qui ont aussi moins de 75 % de réussite dans chaque domaine d’apprentissage.</p>
    <div class="rv-jl-results-grid rv-v87-priority-grid">
      <div class="rv-jl-result-emphasis rv-v87-kpi"><strong>${eligible} / ${PUPILS.length}</strong><span>Élèves repérés pour une possible remédiation</span><p>Ils ont moins de 75 % de réussite dans les bases essentielles.</p></div>
      <div class="rv-v87-right"><div class="rv-jl-kicker">Domaines à examiner en priorité</div>
       <div class="rv-v87-recommended"><span class="rv-priority-num">1</span>${rvJLDomainIcon(first.id)}<div class="rv-v87-domain-copy"><strong>${esc(first.name)}</strong><small>${primary.count} des ${eligible} élèves repérés ont aussi moins de 75 % dans ce domaine.</small></div></div>
       <div class="rv-v87-other-domains">${others.map((f,i)=>{const stat=rvStats(f.id);return `<div class="rv-v87-domain-small"><span class="rv-v87-order-label">PRIORITÉ ${i+2}</span>${rvJLDomainIcon(f.id)}<div class="rv-v87-domain-copy"><strong>${esc(f.name)}</strong><small>${stat.count} élèves sur ${eligible}</small></div></div>`}).join('')}</div>
      </div>
    </div>
    <div class="rv-v87-bottomnote">${RV_V87_INFO_ICON}<span>Les nombres sont recommandés d’abord pour leur importance pédagogique ; les autres domaines sont classés selon leur réussite moyenne. Un élève peut être en difficulté dans plusieurs domaines, mais ne rejoindra qu’un seul groupe pour cette série de séances. Le professeur référent pourra modifier l’ordre proposé.</span></div>`,
  footer:rvFooter('Retour aux dispositifs','rv-back-device','Choisir l’organisation','rv-to-time')
 });
};
// L'écran des choix suit l'esprit des deux cartes de Jean-Louis :
// trois possibilités réelles mais aucune décision supplémentaire ajoutée.
PAGES['rv-time']=function(){
 const options=[
  ['edt','Utiliser des heures de soutien déjà prévues','Ces séances figurent déjà dans l’emploi du temps.'],
  ['complement','Ajouter des séances de soutien','Ces séances s’ajoutent aux cours habituels.'],
  ['mixte','Combiner les deux organisations','Utilisez des créneaux déjà prévus et des séances supplémentaires.']
 ];
 return rvScreen({eyebrow:'REMÉDIATION · ORGANISATION',detail:`${LEVEL_LONG} · Direction`,
  title:'Comment souhaitez-vous organiser les séances ?',
  lead:'Indiquez comment les séances seront organisées. Vous préciserez ensuite les heures et les moyens disponibles.',
  content:`<h2 class="rv-section-title">Choisissez une organisation :</h2><div class="rv-grid three">${options.map(([id,label,description])=>`<button class="rv-choice ${rv.arrangement===id?'active':''}" data-action="rv-arrangement" data-value="${id}" aria-pressed="${rv.arrangement===id}"><span class="rv-choice-mark">${rv.arrangement===id?'✓':'○'}</span><span style="flex:1"><strong>${label}</strong><small>${description}</small></span></button>`).join('')}</div>`,
  footer:rvFooter('Retour aux priorités','rv-to-results','Définir les heures disponibles','rv-to-hours',!rv.arrangement)
 });
};
// L'ordre personnalisé existe déjà en V8.3. On évite la répétition de quatre
// grandes cartes puis quatre lignes en affichant le réglage détaillé à la demande.
rv.jlOrderExpanded=false;
ACTIONS['rv-jl-toggle-order']=()=>{rv.jlOrderExpanded=!rv.jlOrderExpanded;rerenderPreserve();};
PAGES['rv-prof']=function(){
 const ordered=rvRanking(),custom=!!rv.priorityOrder,first=ordered[0];
 const eligible=PUPILS.filter(p=>p.correctBySocle[0]*4<TOTAL_PER_SOCLE[0]*3).length;
 const orderLabels={nombres:'Nombres',relations:'Relations mathématiques',espace:'Espace et formes',donnees:'Données'};
 return rvScreen({eyebrow:'REMÉDIATION · ESPACE PROFESSEUR RÉFÉRENT',detail:`${rvSeriesLabel(rvRounds())} · ${LEVEL_LONG}`,
  title:'Choisir les apprentissages à renforcer en priorité',
  lead:'Stud’Éval recommande de commencer par les nombres. Vous pouvez choisir un autre domaine selon les besoins de vos élèves.',
  content:`<div class="rv-jl-prof-core"><div><strong>${rvAvailable()} h restantes</strong> sur ${rv.annual} h annuelles</div><div>${rv.teachers} enseignants mobilisables · ${rv.rooms} salles disponibles</div></div>
   <div class="rv-v87-rule"><span><strong>${eligible} élèves sur ${PUPILS.length}</strong> ont moins de 75 % dans les bases essentielles.</span><span class="rv-v87-rule-divider">·</span><span>Pour chaque domaine, seuls ceux ayant <strong>aussi moins de 75 % dans ce domaine</strong> peuvent être retenus.</span></div>
   <h2 class="rv-section-title">Quel domaine souhaitez-vous travailler en premier ?</h2>
   <div class="rv-jl-family-grid rv-v87-family-grid">${RV_FAMILIES.map(f=>{const active=first.id===f.id,stats=rvStats(f.id);return `<button class="rv-choice ${active?'active':''}" data-action="rv-priority" data-family="${f.id}" aria-pressed="${active}">${rvJLDomainIcon(f.id)}<span class="rv-v87-domain-copy"><strong>${esc(f.name)}</strong><small>${stats.count} élèves sur ${eligible} ont moins de 75 % dans ce domaine.</small>${f.id==='nombres'?'<span class="rv-v87-recommend">Priorité recommandée par Stud’Éval</span>':''}</span><span class="rv-choice-mark" aria-hidden="true">${active?'✓':'○'}</span></button>`}).join('')}</div>
   <div class="rv-jl-order-toggle"><div><strong style="color:#203a62;font-size:14px">Ordre des quatre domaines</strong><div class="rv-small">${custom?'Ordre personnalisé par le professeur':'Ordre proposé par Stud’Éval'}</div></div>
   <button class="btn secondary" data-action="rv-jl-toggle-order" aria-expanded="${!!rv.jlOrderExpanded}">${rv.jlOrderExpanded?'Masquer les détails':'Modifier l’ordre des 4 domaines'} ${rv.jlOrderExpanded?'↑':'↓'}</button></div>
   ${rv.jlOrderExpanded?`<div class="rv-jl-priority-details"><div class="rv-priority">${ordered.map((f,i)=>rvEditablePriorityLine(f,i,ordered.length)).join('')}</div><div class="rv-row" style="margin-top:10px"><p class="rv-small" style="margin:0">Utilisez les flèches pour modifier l’ordre.</p>${custom?rvBtn('↺ Revenir aux recommandations','rv-priority-reset','btn secondary minor'):''}</div></div>`:`<div class="rv-v87-order-chips">${ordered.map((f,i)=>`<span class="rv-v87-order-chip"><strong>${i+1}.</strong> ${orderLabels[f.id]}</span>${i<ordered.length-1?'<span class="rv-v87-order-arrow">→</span>':''}`).join('')}</div>`}
   <p class="rv-jl-notice">Vous préparez ici une série de séances. Un élève ne peut intégrer qu’un seul groupe pendant cette série. Vous pouvez modifier les priorités proposées.</p>`,
  footer:rvFooter('Retour aux moyens','rv-to-send',rvStartSessionsLabel(),'rv-to-budget',rvAvailable()<1)
 });
};
// Pour les étapes suivantes, seul l'habillage change : on réutilise les calculs,
// curseurs, listes, transferts et boutons de validation déjà fonctionnels.

// La version affichée est actualisée seulement pour la remédiation.
const rvJLbeforeRender=render;
render=function(){
 rvJLbeforeRender();
 if(!RV_ALL_PAGES.has(state.page))return;
 const version=document.querySelector('.app-role .badge');
 if(version)version.textContent=`V8.8 · ${LEVEL_LONG}`;
 const footer=document.querySelector('#app .screen-footer');
 if(footer)footer.textContent=footer.textContent.replace('Prototype V8.3','Prototype V8.8 · priorités clarifiées');
};

render();


</script></body></html>
